version: '3.8'

services:
  # --- Backend Service ---
  backend:
    build:
      context: ./helloSteve # Path to your Java project folder
      dockerfile: Dockerfile
    container_name: java-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Add database credentials here if using PostgreSQL/MySQL
    restart: always

  # --- Frontend Service ---
  frontend:
    build:
      context: ./hiworld # Path to your React project folder
      dockerfile: Dockerfile
    container_name: hiworld
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always